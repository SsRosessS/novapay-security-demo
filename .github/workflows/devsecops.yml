name: NovaPay DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  seguridad:
    name: Verificaciones de Seguridad y Firma
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Analisis SAST del Modulo 2FA (auth.js)
        run: |
          echo "Analizando auth.js contra OWASP Top 10..."
          node -e '
            const fs = require("fs");
            const codigo = fs.readFileSync("auth.js", "utf8");
            if (codigo.includes("sk_live") || codigo.includes("stripe_key") || codigo.includes("SECRET")) {
              console.error("[CRITICAL - OWASP A02] Credencial privada expuesta dentro de auth.js!");
              process.exit(1);
            }
            console.log("Modulo auth.js verificado exitosamente sin vulnerabilidades.");
          '

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Simular Firma Criptografica del Artefacto
        run: |
          echo "Firmando artefacto autenticado con Cosign..."
          cosign version

  despliegue:
    name: Aprobacion y Despliegue en Produccion
    needs: seguridad
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validar Firma y Desplegar
        run: echo "Despliegue ejecutado de manera segura en produccion."
