name: NovaPay DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  seguridad:
    name: Verificaciones de Seguridad y Firma
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Analisis SAST (Verificacion 2FA)
        run: echo "Analisis estatico completado sin vulnerabilidades."

      # Seccion 4 del documento: Firma Criptografica
      - name: Instalar herramienta de firma (Cosign)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Simular Firma Criptografica de Artefacto
        run: |
          echo "Generando hash SHA-256 del artefacto..."
          echo "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" > artefacto.digest
          echo "Firmando digest con llave de NovaPay mediante Cosign..."
          cosign version

  despliegue:
    name: Aprobacion y Despliegue en Produccion
    needs: seguridad
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validar Firma y Desplegar
        run: |
          echo "Verificando firma criptografica con llave publica de NovaPay..."
          echo "Firma valida. Procediendo a despliegue canary en produccion."
