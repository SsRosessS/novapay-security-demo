name: NovaPay DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  seguridad:
    name: Verificaciones de Seguridad (DevSecOps)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Escaneo SAST y Deteccion de Secretos
        run: |
          echo "Iniciando analisis de seguridad sobre modulo 2FA..."
          echo "[ALERTA] Credencial critica o fallo logico detectado en auth.js (OWASP A02)"
          echo "Activando Build Breaker segun politica NovaPay..."
          exit 1 # Esto fuerza el error de seguridad

  despliegue:
    name: Aprobacion y Despliegue en Produccion
    needs: seguridad
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar en NovaPay
        run: |
          echo "Despliegue completado de manera segura en produccion."
